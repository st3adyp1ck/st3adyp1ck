name: Generate contribution snake

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: st3adyp1ck
          outputs: |
            dist/github-snake.svg?color_snake=2F7FF5&color_dots=0B0E16,123A6E,2F7FF5,8FC0FF,E3EEFF&color_background=05060A

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
